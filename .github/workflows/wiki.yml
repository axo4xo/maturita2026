name: Deploy wiki

on:
  push:
    branches: [main, wiki-vitepress]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wiki app
        uses: actions/checkout@v4
        with:
          ref: wiki-vitepress

      - name: Checkout content
        uses: actions/checkout@v4
        with:
          ref: main
          path: content

      - name: Ensure wiki home page
        run: |
          if [ ! -f content/index.md ] && [ -f content/README.md ]; then
            cp content/README.md content/index.md
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
